<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio2</title>
</head>
<body>
    <form>
        <label>Distância:</label>
        <input type="number" id="dis" /><br>
        
        
        
        
    </form>
    <button onclick="calcular()">calcular</button>
        <P id="resultado" ></P>
</body>
<script>
      function calcular(){
          let dis = Number(document.getElementById("dis").value);
          let frete = 0;

          if(dis <= 100  * 1.50 ){
                frete = dis * 1.5;
          }
          
          else{
            frete = dis * 1.2;
          }
          document.getElementById("resultado").innerHTML = "O valor do frete é R$"+frete;
          
 }

</script>
</html>
